syntax = "proto3";

package gamepb.sharepb;

import "corepb.proto";

// ============ 分享服务 ============

// --- 检查是否可以分享 ---
message CheckCanShareRequest {}

message CheckCanShareReply {
    bool can_share = 1;  // 是否可以分享
}

// --- 报告分享 ---
// 注意：真实协议不是 bool。字段 1 是 int32 的「分享来源」，字段 4 是「场景」，
// 每日分享固定传 1 / 42（对照上游 services/share.ts 的 reportShare）。
// 早期版本这里误写成 bool shared = 1，会导致服务端不认、回复里也不存在 success 语义。
message ReportShareRequest {
    int32 field_1 = 1;  // 分享来源（每日分享 = 1）
    int32 field_4 = 4;  // 场景（每日分享 = 42）
}

// 回复的字段 1 是 bytes result，不是 bool success；
// 上游只 decode 不判断返回值——请求发出且不抛异常即视为上报成功。
message ReportShareReply {
    bytes result = 1;
}

// --- 领取分享奖励 ---
message ClaimShareRewardRequest {
    bool claimed = 1;  // 请求领取
}

message ClaimShareRewardReply {
    bool success = 1;           // 是否成功
    bool has_reward = 2;        // 是否有奖励
    repeated corepb.Item items = 3;  // 奖励物品列表
}
