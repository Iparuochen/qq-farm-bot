syntax = "proto3";

package gamepb.weatherpb;

service WeatherService {
    rpc GetWeatherStatus(GetWeatherStatusRequest) returns (GetWeatherStatusReply);
}

// 当前农场的特殊天气。雨落成诗活动中 weather_type=1 表示雷雨。
//
// 字段 1/3 沿用历史命名 type / start_time，因为 services/activity.js 的
// normalizeWeatherStatus 依赖它们；这里补齐 begin_time / field_9，
// 以支持上游 weather-activity 的好友现场天气判定（雷雨是否已采过）。
// 字段号与上游一致：1=weather_type、3=begin_time、9=field_9。
message WeatherStatus {
    int64 weather_type = 1;
    int64 status = 2;
    int64 begin_time = 3;
    int64 end_time = 4;
    int64 source = 5;
    int64 field_8 = 8;
    // 好友现场天气附带的活动标记。实机已见晴天=1、雷雨已采=4；
    // 不能再沿用旧实现把 field_8 当作该标记。
    int64 field_9 = 9;
}

message GetWeatherStatusRequest {}

message GetWeatherStatusReply { WeatherStatus weather = 1; }

// 天气变化推送。weather 为空表示天气结束。
message WeatherChangeNotify {
    WeatherStatus weather = 1;
    int64 host_gid = 2;
}
