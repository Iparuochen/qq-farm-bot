syntax = "proto3";

// 图鉴相关
package gamepb.illustratedpb;

import "corepb.proto";

service IllustratedService {
  rpc GetIllustratedListV2(GetIllustratedListV2Request) returns (GetIllustratedListV2Reply);
  rpc GetIllustratedLevelListV2(GetIllustratedLevelListV2Request) returns (GetIllustratedLevelListV2Reply);
  rpc ClaimAllRewardsV2(ClaimAllRewardsV2Request) returns (ClaimAllRewardsV2Reply);
  rpc ClearNewUnlockedFruitsV2(ClearNewUnlockedFruitsV2Request) returns (ClearNewUnlockedFruitsV2Reply);
}

message GetIllustratedListV2Request {
    bool refresh = 1;
//    bool full = 2;
    int32 illustrated_type = 2; // 1 = crop illustrated tab, 2 = mutant illustrated tab
}

message IllustratedItem {
    int64 seed_id = 1;
    int32 illustrated_tier = 2;
    bool unlocked = 3;
    int32 reward_score = 4;
    int32 harvest_count = 5;
    bytes reward_info = 6;
    bool has_reward = 7;
    IllustratedGuaranteeInfo guarantee_info = 8;
}

// Only present for mutant illustrated entries whose wish guarantee is enabled.
message IllustratedGuaranteeInfo {
    int32 progress_type = 1;
    int32 current = 2;
    int32 total = 3;
}

message GetIllustratedListV2Reply {
    repeated IllustratedItem items = 1;
    int32 current_score = 2;
    int32 level = 3;
    bytes level_reward = 4;
    repeated int32 unlocked_tiers = 5;
    int32 current_tier = 6;
    int32 next_score = 7;
    bool has_level_reward = 9;
    repeated corepb.Item level_rewards = 10;
    repeated corepb.Item next_level_rewards = 11;
}

// 图鉴等级奖励列表（作物图鉴「详情」弹窗的等级进度与奖励）
message GetIllustratedLevelListV2Request {
    int32 type = 1;
}

message IllustratedLevel {
    int32 level = 1;
    int64 progress = 2;
    repeated IllustratedReward rewards = 3;
    bool claimed = 5;
}

message GetIllustratedLevelListV2Reply {
    int32 level = 1;
    int64 progress = 2;
    repeated IllustratedLevel levels = 3;
}

// 图鉴奖励条目（item_id + count）
message IllustratedReward {
    int64 item_id = 1;
    int64 count = 2;
}

message ClaimAllRewardsV2Request {
    bool only_claimable = 1;
}

message ClaimAllRewardsV2Reply {
    repeated corepb.Item items = 1;
    repeated corepb.Item bonus_items = 4;
}

message IllustratedRewardRedDotNotifyV2 {}

// ============ 清除新解锁水果标记 V2 ============
message ClearNewUnlockedFruitsV2Request {
    bytes seed_id = 1;
}

message ClearNewUnlockedFruitsV2Reply {
    bytes seed_id = 1;
}
